<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food reviews gallery</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2a2622;--muted:#7a7068;--accent:#c4573a;--border:#e6dfd5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a18;--card:#2a2724;--text:#f1ebe3;--muted:#a39a90;--accent:#e07a5c;--border:#3c3834;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a18;--card:#2a2724;--text:#f1ebe3;--muted:#a39a90;--accent:#e07a5c;--border:#3c3834;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:.95rem}
.add{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;gap:12px;font-family:system-ui,sans-serif;margin-bottom:28px}
.drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.drop img{max-width:100%;max-height:220px;border-radius:8px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;color:var(--muted);padding:4px 8px;font-size:.85rem}
button.ghost:hover{color:var(--accent)}
.grid{columns:3 260px;column-gap:18px}
figure{margin:0 0 18px;break-inside:avoid;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%}
figcaption{padding:12px 14px 8px}
figcaption p{margin:0 0 6px;word-wrap:break-word}
.row{display:flex;gap:4px;font-family:system-ui,sans-serif}
.empty{color:var(--muted);text-align:center;font-family:system-ui,sans-serif;padding:30px 0}
.note{color:var(--muted);font-size:.8rem;font-family:system-ui,sans-serif;margin-top:30px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Food reviews gallery</h1>
  <p class="sub">Add a picture, write a caption, and it appears below.</p>

  <div class="add">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <span id="dropText">Click to choose a picture</span>
    </label>
    <input type="text" id="caption" placeholder="Write a caption…" maxlength="200">
    <button id="addBtn" disabled>Add to gallery</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No pictures yet. Add your first one above.</p>
  <p class="note">Pictures are saved in this browser only.</p>
</main>

<script>
(function(){
  var KEY = "gallery-items";
  var items = [];
  var pending = null;
  var fileEl = document.getElementById("file");
  var capEl = document.getElementById("caption");
  var addBtn = document.getElementById("addBtn");
  var dropText = document.getElementById("dropText");
  var drop = document.getElementById("drop");
  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");

  function load(){
    try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e){ items = []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(items)); return true; }
    catch(e){ alert("Storage is full. Delete a picture to add more."); return false; }
  }

  function shrink(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.8));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  function render(){
    empty.style.display = items.length ? "none" : "block";
    grid.innerHTML = items.map(function(it){
      return '<figure data-id="' + it.id + '"><img src="' + it.src + '" alt="' + esc(it.caption) + '">' +
        '<figcaption><p>' + esc(it.caption || "") + '</p>' +
        '<div class="row"><button class="ghost" data-act="edit">Edit caption</button>' +
        '<button class="ghost" data-act="del">Delete</button></div></figcaption></figure>';
    }).join("");
  }

  fileEl.addEventListener("change", function(){
    var f = fileEl.files[0];
    if(!f) return;
    shrink(f, function(data){
      pending = data;
      dropText.innerHTML = '<img src="' + data + '" alt="Preview">';
      addBtn.disabled = false;
    });
  });

  addBtn.addEventListener("click", function(){
    if(!pending) return;
    items.unshift({ id: Date.now(), src: pending, caption: capEl.value.trim() });
    if(!save()){ items.shift(); return; }
    pending = null; fileEl.value = ""; capEl.value = "";
    dropText.textContent = "Click to choose a picture";
    addBtn.disabled = true;
    render();
  });

  grid.addEventListener("click", function(e){
    var act = e.target.getAttribute("data-act");
    if(!act) return;
    var id = Number(e.target.closest("figure").getAttribute("data-id"));
    var it = items.filter(function(x){ return x.id === id; })[0];
    if(act === "del"){
      items = items.filter(function(x){ return x.id !== id; });
      save(); render();
    } else if(act === "edit"){
      var n = prompt("New caption:", it.caption);
      if(n !== null){ it.caption = n.trim(); save(); render(); }
    }
  });

  load(); render();
})();
</script>
</body>
</html>
