<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Picture Gallery</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2a2622;--muted:#7a7068;--accent:#c4573a;--border:#e6dfd5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#2a2724;--text:#f1ebe3;--muted:#a39a90;--accent:#e07a5c;--border:#3c3834;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:.95rem}
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:grid;gap:12px;font-family:system-ui,sans-serif;margin-bottom:28px}
.hidden{display:none}
.drop{border:2px dashed var(--border);border-radius:10px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--accent)}
.drop img{max-width:100%;max-height:220px;border-radius:8px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:1rem}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;color:var(--muted);padding:4px 8px;font-size:.85rem}
button.ghost:hover{color:var(--accent)}
.grid{columns:3 260px;column-gap:18px}
figure{margin:0 0 18px;break-inside:avoid;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
figure img{display:block;width:100%}
figcaption{padding:12px 14px 10px}
figcaption p{margin:0 0 6px;word-wrap:break-word}
.row{display:flex;gap:4px;font-family:system-ui,sans-serif}
.msg{color:var(--muted);text-align:center;font-family:system-ui,sans-serif;padding:30px 0}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>My Picture Gallery</h1>
      <p class="sub">Pictures and captions, saved online for everyone to see.</p>
    </div>
    <button class="ghost" id="authBtn">Owner login</button>
  </header>

  <!-- Login form (only the owner uses this) -->
  <div class="panel hidden" id="loginPanel">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Log in</button>
  </div>

  <!-- Add form (visible only after login) -->
  <div class="panel hidden" id="addPanel">
    <label class="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <span id="dropText">Click to choose a picture</span>
    </label>
    <input type="text" id="caption" placeholder="Write a caption…" maxlength="200">
    <button id="addBtn" disabled>Add to gallery</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="msg" id="msg">Loading…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your own values from Supabase: Project Settings > API
var SUPABASE_URL = "https://fviavjohlcgxbmmljgki.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_oLJ3KLxPzGHx9MNqENcDTQ_mvtNNa0w";

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var BUCKET = "pictures";
var loggedIn = false;
var pendingBlob = null;
var rows = [];

var $ = function(id){ return document.getElementById(id); };

function esc(t){
  var d = document.createElement("div");
  d.textContent = t || "";
  return d.innerHTML.replace(/"/g, "&quot;");
}

// ---------- Load and show pictures ----------
async function loadPictures(){
  var res = await sb.from("pictures").select("*").order("created_at", { ascending: false });
  if (res.error){ $("msg").textContent = "Could not load pictures: " + res.error.message; return; }
  rows = res.data;
  render();
}

function render(){
  $("msg").style.display = rows.length ? "none" : "block";
  $("msg").textContent = "No pictures yet.";
  $("grid").innerHTML = rows.map(function(r){
    var buttons = loggedIn
      ? '<div class="row"><button class="ghost" data-act="edit">Edit caption</button><button class="ghost" data-act="del">Delete</button></div>'
      : "";
    return '<figure data-id="' + r.id + '"><img src="' + r.url + '" alt="' + esc(r.caption) + '" loading="lazy">' +
          '<figcaption><p>' + esc(r.caption) + '</p>' + buttons + '</figcaption></figure>';
  }).join("");
}

// ---------- Login / logout ----------
function updateAuthUI(){
  $("addPanel").classList.toggle("hidden", !loggedIn);
  $("authBtn").textContent = loggedIn ? "Log out" : "Owner login";
  if (loggedIn) $("loginPanel").classList.add("hidden");
  render();
}

$("authBtn").addEventListener("click", async function(){
  if (loggedIn){ await sb.auth.signOut(); return; }
  $("loginPanel").classList.toggle("hidden");
});

$("loginBtn").addEventListener("click", async function(){
  var res = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (res.error) alert("Login failed: " + res.error.message);
});

sb.auth.onAuthStateChange(function(event, session){
  loggedIn = !!session;
  updateAuthUI();
});

// ---------- Choose and resize a picture ----------
$("file").addEventListener("change", function(){
  var f = $("file").files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1200 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob){
        pendingBlob = blob;
        $("dropText").innerHTML = '<img src="' + URL.createObjectURL(blob) + '" alt="Preview">';
        $("addBtn").disabled = false;
      }, "image/jpeg", 0.85);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});

// ---------- Upload ----------
$("addBtn").addEventListener("click", async function(){
  if (!pendingBlob) return;
  $("addBtn").disabled = true;
  var path = Date.now() + ".jpg";

  var up = await sb.storage.from(BUCKET).upload(path, pendingBlob, { contentType: "image/jpeg" });
  if (up.error){ alert("Upload failed: " + up.error.message); $("addBtn").disabled = false; return; }

  var url = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  var ins = await sb.from("pictures").insert({ url: url, path: path, caption: $("caption").value.trim() });
  if (ins.error){ alert("Saving failed: " + ins.error.message); $("addBtn").disabled = false; return; }

  pendingBlob = null;
  $("file").value = "";
  $("caption").value = "";
  $("dropText").textContent = "Click to choose a picture";
  loadPictures();
});

// ---------- Edit / delete ----------
$("grid").addEventListener("click", async function(e){
  var act = e.target.getAttribute("data-act");
  if (!act) return;
  var id = Number(e.target.closest("figure").getAttribute("data-id"));
  var row = rows.filter(function(r){ return r.id === id; })[0];

  if (act === "edit"){
    var n = prompt("New caption:", row.caption);
    if (n === null) return;
    var u = await sb.from("pictures").update({ caption: n.trim() }).eq("id", id);
    if (u.error) alert(u.error.message);
  } else if (act === "del"){
    if (!confirm("Delete this picture?")) return;
    await sb.storage.from(BUCKET).remove([row.path]);
    var d = await sb.from("pictures").delete().eq("id", id);
    if (d.error) alert(d.error.message);
  }
  loadPictures();
});

loadPictures();
</script>
</body>
</html>
